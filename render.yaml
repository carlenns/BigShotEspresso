# Render Blueprint for BigShotEspresso Coffee Log.
# Secret values are intentionally omitted. Render will prompt for sync:false values.
services:
  - type: web
    runtime: node
    name: bigshotespresso-coffee-log
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build:render
    startCommand: pnpm run start:render
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
