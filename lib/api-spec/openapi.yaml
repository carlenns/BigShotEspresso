openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Coffee Log API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: shots
    description: Espresso shot operations
  - name: dashboard
    description: Dashboard summaries
  - name: insights
    description: Pattern insights
  - name: hoppers
    description: Hopper state and imported baseline records

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /shots:
    get:
      operationId: listShots
      tags: [shots]
      summary: List all shots with optional filters
      parameters:
        - name: bean
          in: query
          schema: { type: string }
        - name: bag
          in: query
          schema: { type: ["string", "null"] }
        - name: status
          in: query
          schema: { type: string }
        - name: faultStatus
          in: query
          schema: { type: string }
        - name: isReference
          in: query
          schema: { type: string }
        - name: ratingMin
          in: query
          schema: { type: string }
        - name: ratingMax
          in: query
          schema: { type: string }
        - name: pourDelayMin
          in: query
          schema: { type: string }
        - name: pourDelayMax
          in: query
          schema: { type: string }
        - name: pourTimeMin
          in: query
          schema: { type: string }
        - name: pourTimeMax
          in: query
          schema: { type: string }
        - name: doseMin
          in: query
          schema: { type: string }
        - name: doseMax
          in: query
          schema: { type: string }
        - name: yieldMin
          in: query
          schema: { type: string }
        - name: yieldMax
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string }
        - name: dateTo
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: string }
        - name: offset
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of shots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShotList"

    post:
      operationId: createShot
      tags: [shots]
      summary: Create a new shot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShotInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shot"

  /shots/import-csv:
    post:
      operationId: importShotsCsv
      tags: [shots]
      summary: Import shots from CSV text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CsvImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportResult"

  /shots/{id}:
    get:
      operationId: getShot
      tags: [shots]
      summary: Get a single shot by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Shot details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shot"
        "404":
          description: Not found

    patch:
      operationId: updateShot
      tags: [shots]
      summary: Update a shot
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShotUpdate"
      responses:
        "200":
          description: Updated shot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shot"
        "404":
          description: Not found

    delete:
      operationId: deleteShot
      tags: [shots]
      summary: Delete a shot
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /shots/{id}/similar:
    get:
      operationId: getSimilarShots
      tags: [shots]
      summary: Get shots similar to the given shot
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Similar shots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shot"
        "404":
          description: Not found

  /shots/reference:
    get:
      operationId: listReferenceShots
      tags: [shots]
      summary: List reference shots with optional filters
      parameters:
        - name: bean
          in: query
          schema: { type: string }
        - name: bag
          in: query
          schema: { type: string }
        - name: ratingMin
          in: query
          schema: { type: string }
        - name: yieldMin
          in: query
          schema: { type: string }
        - name: yieldMax
          in: query
          schema: { type: string }
        - name: pourTimeMin
          in: query
          schema: { type: string }
        - name: pourTimeMax
          in: query
          schema: { type: string }
        - name: pourDelayMin
          in: query
          schema: { type: string }
        - name: pourDelayMax
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Reference shots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shot"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard summary statistics
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/recent:
    get:
      operationId: getRecentShots
      tags: [dashboard]
      summary: Most recent shots
      parameters:
        - name: limit
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Recent shots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shot"

  /dashboard/best-rated:
    get:
      operationId: getBestRatedShots
      tags: [dashboard]
      summary: Best-rated shots
      parameters:
        - name: limit
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Best-rated shots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shot"

  /insights:
    get:
      operationId: getInsights
      tags: [insights]
      summary: Plain-language pattern insights from shot data
      parameters:
        - name: bean
          in: query
          schema: { type: string }
        - name: bag
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Insight"

  /hoppers:
    get:
      operationId: listHoppers
      tags: [hoppers]
      responses:
        "200":
          description: Hopper states
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Hopper" }
    post:
      operationId: createHopper
      tags: [hoppers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HopperInput" }
      responses:
        "201":
          description: Created hopper state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hopper" }

  /hoppers/{id}:
    patch:
      operationId: updateHopper
      tags: [hoppers]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HopperUpdate" }
      responses:
        "200":
          description: Updated hopper state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hopper" }

  /hoppers/import-csv:
    post:
      operationId: importHoppersCsv
      tags: [hoppers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CsvImportInput" }
      responses:
        "200":
          description: Hopper import result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsvImportResult" }

  /hopper-range-baselines:
    get:
      operationId: listHopperRangeBaselines
      tags: [hoppers]
      responses:
        "200":
          description: Hopper range baselines
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HopperRangeBaseline" }
    post:
      operationId: createHopperRangeBaseline
      tags: [hoppers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HopperRangeBaselineInput" }
      responses:
        "201":
          description: Created baseline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HopperRangeBaseline" }

  /hopper-range-baselines/import-csv:
    post:
      operationId: importHopperRangeBaselinesCsv
      tags: [hoppers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CsvImportInput" }
      responses:
        "200":
          description: Hopper range baseline import result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsvImportResult" }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    StringArray:
      type: array
      items: { type: string }

    Shot:
      type: object
      required: [id, shotDate, isReference, createdAt]
      properties:
        id: { type: integer }
        shotDate: { type: string }
        bagId: { type: ["integer", "null"] }
        grinderId: { type: ["integer", "null"] }
        machineId: { type: ["integer", "null"] }
        hopperId: { type: ["integer", "null"] }
        hopperRangeBaselineId: { type: ["integer", "null"] }
        bean: { type: ["string", "null"] }
        bag: { type: ["string", "null"] }
        bagLabel: { type: ["string", "null"] }
        daysSinceOpen: { type: ["integer", "null"] }
        grindSetting: { type: ["number", "null"] }
        grindTime: { type: ["number", "null"] }
        initialGrindWeight: { type: ["number", "null"] }
        totalOutput: { type: ["number", "null"] }
        dose: { type: ["number", "null"] }
        timeAdj: { type: ["number", "null"] }
        topUpGrind: { type: ["number", "null"] }
        overGrindRemoved: { type: ["number", "null"] }
        beanDelta: { type: ["number", "null"] }
        grindWaste: { type: ["number", "null"] }
        beansAdded: { type: ["number", "null"] }
        doseCorrectionType: { type: ["string", "null"] }
        doseCorrection: { type: ["number", "null"] }
        outputDelta: { type: ["number", "null"] }
        yield: { type: ["number", "null"] }
        ratio: { type: ["string", "null"] }
        temperature: { type: ["integer", "null"] }
        pourDelay: { type: ["integer", "null"] }
        pourTime: { type: ["integer", "null"] }
        flowTime: { type: ["integer", "null"] }
        rating: { type: ["number", "null"], maximum: 10, description: "Technical/extraction rating. Capped at 10." }
        preferenceRating: { type: ["number", "null"], maximum: 11, description: "Personal enjoyment score. Capped at 11 for rare benchmark shots." }
        ratingDifference: { type: ["number", "null"], readOnly: true }
        avgWeightedRating: { type: ["number", "null"], readOnly: true }
        rated: { type: ["boolean", "null"] }
        isForOthers: { type: ["boolean", "null"] }
        isReference: { type: boolean }
        signatureShot: { type: ["boolean", "null"] }
        sourShot: { type: ["boolean", "null"] }
        boundaryShot: { type: ["boolean", "null"] }
        drinkType: { type: ["string", "null"] }
        status: { type: ["string", "null"] }
        faultStatus:
          oneOf: [{ $ref: "#/components/schemas/StringArray" }, { type: "null" }]
        shotClassification:
          oneOf: [{ $ref: "#/components/schemas/StringArray" }, { type: "null" }]
        beanAchievement:
          oneOf: [{ $ref: "#/components/schemas/StringArray" }, { type: "null" }]
        expressionStyle:
          oneOf: [{ $ref: "#/components/schemas/StringArray" }, { type: "null" }]
        referenceType: { type: ["string", "null"] }
        dailyDriverCount: { type: ["integer", "null"], readOnly: true }
        importantToIntelligence: { type: ["boolean", "null"] }
        intelligenceLessonType:
          oneOf: [{ $ref: "#/components/schemas/StringArray" }, { type: "null" }]
        includeInAnalysis: { type: ["boolean", "null"], readOnly: true }
        notes: { type: ["string", "null"] }
        sensoryNotes: { type: ["string", "null"] }
        faultNotes: { type: ["string", "null"] }
        bagOpenedDate: { type: ["string", "null"], readOnly: true }
        grindAdjusted: { type: ["string", "null"] }
        shotsLeftEst: { type: ["number", "null"] }
        finishedShot: { type: ["boolean", "null"] }
        hopperPhase: { type: ["string", "null"] }
        hopperFullness: { type: ["number", "null"] }
        hopperPercent: { type: ["number", "null"], readOnly: true }
        hopperRange: { type: ["string", "null"], readOnly: true }
        tasteZone: { type: ["string", "null"] }
        zone: { type: ["string", "null"], readOnly: true }
        zoneScore: { type: ["integer", "null"], readOnly: true }
        tasteScore: { type: ["integer", "null"], readOnly: true }
        agreementPercent: { type: ["number", "null"], readOnly: true }
        flowScore: { type: ["number", "null"], readOnly: true }
        modelFlag: { type: ["string", "null"], readOnly: true }
        timeGap: { type: ["integer", "null"], readOnly: true }
        scaleZone: { type: ["string", "null"], readOnly: true }
        flowDiagnostic: { type: ["string", "null"], readOnly: true }
        pourDelayWindow: { type: ["string", "null"], readOnly: true }
        flowTimeWindow: { type: ["string", "null"], readOnly: true }
        flowTimeOffset: { type: ["number", "null"], readOnly: true }
        driftDelta: { type: ["number", "null"], readOnly: true }
        shotDriftStatus: { type: ["string", "null"], readOnly: true }
        shotQualityScore: { type: ["number", "null"], readOnly: true }
        shotTier: { type: ["string", "null"], readOnly: true }
        perfectRangeFlag: { type: ["string", "null"], readOnly: true }
        driftWarning: { type: ["string", "null"], readOnly: true }
        hopperZone: { type: ["string", "null"], readOnly: true }
        hopperDriftLink: { type: ["string", "null"], readOnly: true }
        hopperImpactScore: { type: ["number", "null"], readOnly: true }
        hopperCorrectionRule: { type: ["string", "null"], readOnly: true }
        actionSuggestion: { type: ["string", "null"], readOnly: true }
        scaleCalibrationReminder: { type: ["string", "null"], readOnly: true }
        bagCalibrationReminder: { type: ["string", "null"], readOnly: true }
        calculation: { type: ["string", "null"], readOnly: true }
        baselineUnaidedOutput: { type: ["number", "null"], readOnly: true }
        baselineOutputDelta: { type: ["number", "null"], readOnly: true }
        actualDoseError: { type: ["number", "null"], readOnly: true }
        hopperThresholdFlag: { type: ["string", "null"], readOnly: true }
        hopperBehaviour: { type: ["string", "null"], readOnly: true }
        hopperSeverity: { type: ["string", "null"], readOnly: true }
        topUpGap: { type: ["number", "null"], readOnly: true }
        topUpRecommendation: { type: ["string", "null"], readOnly: true }
        grinderInitialOutputForCharts: { type: ["number", "null"], readOnly: true }
        createdAt: { type: string }

    ShotList:
      type: object
      required: [shots, total]
      properties:
        shots:
          type: array
          items: { $ref: "#/components/schemas/Shot" }
        total: { type: integer }

    ShotWriteFields:
      type: object
      properties: &shotWriteProperties
        shotDate: { type: string }
        bagId: { type: ["integer", "null"] }
        grinderId: { type: ["integer", "null"] }
        machineId: { type: ["integer", "null"] }
        hopperId: { type: ["integer", "null"] }
        bean: { type: string }
        bag: { type: string }
        grindSetting: { type: ["number", "null"] }
        grindTime: { type: ["number", "null"] }
        initialGrindWeight: { type: ["number", "null"] }
        totalOutput: { type: ["number", "null"] }
        dose: { type: ["number", "null"] }
        timeAdj: { type: ["number", "null"] }
        topUpGrind: { type: ["number", "null"] }
        overGrindRemoved: { type: ["number", "null"] }
        grindWaste: { type: ["number", "null"] }
        beansAdded: { type: ["number", "null"] }
        doseCorrectionType: { type: string }
        doseCorrection: { type: ["number", "null"] }
        yield: { type: ["number", "null"] }
        ratio: { type: ["string", "null"], readOnly: true, description: "Calculated as yield divided by dose when dose and yield are present." }
        temperature: { type: ["integer", "null"] }
        pourDelay: { type: ["integer", "null"] }
        pourTime: { type: ["integer", "null"] }
        flowTime: { type: ["integer", "null"] }
        scaleTime: { type: ["integer", "null"], deprecated: true, description: "Temporary compatibility alias for flowTime." }
        rating: { type: ["number", "null"] }
        preferenceRating: { type: ["number", "null"] }
        rated: { type: ["boolean", "null"] }
        isForOthers: { type: ["boolean", "null"] }
        isReference: { type: boolean }
        signatureShot: { type: ["boolean", "null"] }
        sourShot: { type: ["boolean", "null"] }
        boundaryShot: { type: boolean }
        drinkType: { type: ["string", "null"] }
        status: { type: string }
        faultStatus: { $ref: "#/components/schemas/StringArray" }
        shotClassification:
          oneOf:
            - $ref: "#/components/schemas/StringArray"
            - type: "null"
        beanAchievement:
          oneOf:
            - $ref: "#/components/schemas/StringArray"
            - type: "null"
        expressionStyle:
          oneOf:
            - $ref: "#/components/schemas/StringArray"
            - type: "null"
        importantToIntelligence: { type: boolean }
        intelligenceLessonType: { $ref: "#/components/schemas/StringArray" }
        includeInAnalysis: { type: boolean, default: true }
        tasteZone: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        sensoryNotes: { type: ["string", "null"] }
        faultNotes: { type: string }
        grindAdjusted: { type: string }
        finishedShot: { type: ["boolean", "null"] }
        shotsLeftEst: { type: ["number", "null"] }

    ShotInput:
      type: object
      required: [shotDate]
      properties: *shotWriteProperties

    ShotUpdate:
      type: object
      properties: *shotWriteProperties

    CsvImportInput:
      type: object
      required: [csvText]
      properties:
        csvText:
          type: string

    Hopper:
      type: object
      required: [id, name, isActive, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        bagId: { type: ["integer", "null"] }
        startingBeans: { type: ["number", "null"] }
        isActive: { type: boolean }
        hopperMass: { type: ["number", "null"], readOnly: true }
        hopperPercent: { type: ["number", "null"], readOnly: true }
        shotsLeftEstimate: { type: ["number", "null"], readOnly: true }
        phase: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string }

    HopperInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        bagId: { type: ["integer", "null"] }
        startingBeans: { type: ["number", "null"] }
        isActive: { type: boolean }
        phase: { type: string }
        notes: { type: string }

    HopperUpdate:
      type: object
      properties:
        name: { type: string }
        bagId: { type: ["integer", "null"] }
        startingBeans: { type: ["number", "null"] }
        isActive: { type: boolean }
        phase: { type: string }
        notes: { type: string }

    HopperRangeBaseline:
      type: object
      required: [id, hopperRange, createdAt]
      properties:
        id: { type: integer }
        hopperRange: { type: string }
        baselineOutputAdjustedDate: { type: ["string", "null"] }
        baselineOutputStatus: { type: ["string", "null"] }
        baselineOutput: { type: ["number", "null"] }
        avgInitialOutput: { type: ["number", "null"], readOnly: true }
        observationCount: { type: ["integer", "null"], readOnly: true }
        createdAt: { type: string }

    HopperRangeBaselineInput:
      type: object
      required: [hopperRange]
      properties:
        hopperRange: { type: string }
        baselineOutputAdjustedDate: { type: ["string", "null"] }
        baselineOutputStatus: { type: string }
        baselineOutput: { type: ["number", "null"] }

    CsvImportResult:
      type: object
      required: [imported, skipped, errors]
      properties:
        imported:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: string

    DashboardSummary:
      type: object
      required: [totalShots, referenceShots, avgDose, avgYield, avgPourTime, avgPourDelay, topBeans]
      properties:
        totalShots:
          type: integer
        referenceShots:
          type: integer
        avgDose:
          type: ["number", "null"]
        avgYield:
          type: ["number", "null"]
        avgPourTime:
          type: ["number", "null"]
        avgPourDelay:
          type: ["number", "null"]
        topBeans:
          type: array
          items:
            $ref: "#/components/schemas/BeanCount"
        statusBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"

    BeanCount:
      type: object
      required: [bean, count]
      properties:
        bean:
          type: string
        count:
          type: integer

    StatusCount:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
        count:
          type: integer

    Insight:
      type: object
      required: [id, text, category]
      properties:
        id:
          type: string
        text:
          type: string
        category:
          type: string
        confidence:
          type: ["string", "null"]
